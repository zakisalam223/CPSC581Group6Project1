<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Button Family</title>
    <style>body{background-image:url(https://images.unsplash.com/photo-1773848801744-8479aff48b10?q=80&w=1948&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);background-position:50%;background-repeat:no-repeat;background-size:cover;background-attachment:fixed;margin:0}</style>
  <script type="module" crossorigin src="/CPSC581Group6Project1/assets/index-JQ2xDTUx.js"></script>
  <link rel="stylesheet" crossorigin href="/CPSC581Group6Project1/assets/index-D11XvsJ6.css">
</head>

<body>
</body>

<!-- TOP BOX -->
<div class="topBox">
    <!-- Buttons -->
    <button type="button" class="imageButton peachButton" data-key="btn1">
        <img src="/CPSC581Group6Project1/assets/peachbutton1-B7aqF84f.png">
    </button>

    <button type="button" class="imageButton dragonFruitButton" data-key="btn2">
        <img src="/CPSC581Group6Project1/assets/DragonFruit-CWJfqbSU.png">
    </button>

    <button type="button" class="imageButton melonButton" data-key="btn3">
        <img src="/CPSC581Group6Project1/assets/MelonBlast-CdOIlr21.png">
    </button>

     <button type="button" class="imageButton figButton" data-key="btn4">
        <img src="/CPSC581Group6Project1/assets/FunkyFig1-c3dqZ-ea.png">
    </button>

    <button type="button" class="imageButton" data-key="btn4">
        <!-- <img src="/assets/testButton.png"> -->
         </button>
</div>

<!-- Trash -->
<button id="trash-button" type="button">
    <img src="/CPSC581Group6Project1/assets/trashBin-Cxx8oDrI.png" alt="trash">
</button>

<!-- BOTTOM BOX -->
<div class="bottomBox">
    <!-- Description and Lever -->
    <div class="descriptionLeverBox">
        <div class="descriptionImage">
            <img src="/CPSC581Group6Project1/assets/flavour-description-8rF87rwE.png" alt="flavour description">
            <div class="descriptionInfoBox">
                <h2>Flavour Description</h2>
                <div id="description-container">Press a button above to see a description.</div>
            </div>
        </div>
        <button id="slush-lever" type="button">
            <img src="/CPSC581Group6Project1/assets/slushlever-BqEwjk3r.png" alt="slush lever">
        </button>
    </div>

    <!-- Slush Cup -->
    <div class="cupBox">
        <div id="slushes-container"></div>
        <img src="/CPSC581Group6Project1/assets/cup-ByP5pvaz.png" alt="cup">
    </div>


    <!-- Receipt -->
    <div class="receiptBox">
        <img src="/CPSC581Group6Project1/assets/receipt-6dE-IkMz.png" alt="receipt">
    </div>
</div>

</html>
