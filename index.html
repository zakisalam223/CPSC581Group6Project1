<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Button Family</title>
    <style>
        body {
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1773848801744-8479aff48b10?q=80&w=1948&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    <script type="module" src="/main.js"></script>
</body>

<!-- TOP BOX -->
<div class="topBox">
    <!-- Buttons -->
    <button type="button" class="imageButton" data-key="btn1">
        <img src="/assets/testButton.png">
    </button>

    <button type="button" class="imageButton" data-key="btn2">
        <img src="/assets/testButton.png">
    </button>

    <button type="button" class="imageButton" data-key="btn3">
        <img src="/assets/testButton.png">
    </button>

    <button type="button" class="imageButton" data-key="btn4">
        <img src="/assets/testButton.png">
    </button>
</div>

<!-- BOTTOM BOX -->
<div class="bottomBox">
    <!-- Description and Lever -->
    <div class="descriptionLeverBox">
        <img alt="description image">
        <div id="description-container">Press a button above to see a description.</div>
        <button id="juice-lever" type="button">
            <img src="/assets/slushlever.png" alt="slush lever">
        </button>
    </div>

    <!-- Juice Cup -->
    <div class="cupBox">
        <div id="juices-container"></div>
        <img src="/assets/cup.png" alt="cup">
    </div>

    <!-- Receipt -->
    <div class="receiptBox">
        <img src="/assets/receipt.png" alt="receipt">
    </div>
</div>

</html>
