<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Button Family</title>
</head>

<body>
    <script type="module" src="/main.js"></script>
</body>

<!-- TOP BOX -->
<div class="topBox">
    <!-- Buttons -->
    <button type="button" class="imageButton peachButton" data-key="btn1">
        <img src="/assets/peachbutton1.png">
    </button>

    <button type="button" class="imageButton dragonFruitButton" data-key="btn2">
        <img src="/assets/DragonFruit.png">
    </button>

    <button type="button" class="imageButton melonButton" data-key="btn3">
        <img src="/assets/MelonBlast.png">
    </button>

     <button type="button" class="imageButton figButton" data-key="btn4">
        <img src="/assets/FunkyFig1.png">
    </button>

    <button type="button" class="imageButton" data-key="btn4">
        <!-- <img src="/assets/testButton.png"> -->
         </button>
</div>

<!-- Trash -->
<button id="trash-button" type="button">
    <img src="/assets/trashBin.png" alt="trash">
</button>

<!-- BOTTOM BOX -->
<div class="bottomBox">
    <!-- Description and Lever -->
    <div class="descriptionLeverBox">
        <div class="descriptionImage">
            <img src="/assets/flavour-description.png" alt="flavour description">
            <div class="descriptionInfoBox">
                <h2>Flavour Description</h2>
                <div id="description-container">Press a button above to see a description.</div>
            </div>
        </div>
        <button id="slush-lever" type="button">
            <img src="/assets/slushlever.png" alt="slush lever">
        </button>
    </div>

    <!-- Slush Cup -->
    <div class="cupBox">
        <div class="cupContainer">
            <div id="slushes-container"></div>
            <img class="cup" src="/assets/cup.png" alt="cup">
        </div>
    </div>


    <!-- Receipt -->
    <div class="receiptBox">
        <img src="/assets/receipt.png" alt="receipt">
        <div class="receiptInfoBox">
            <div id="receipt-container">Once your cup is full your receipt will print.</div>
        </div>
    </div>
</div>

</html>
